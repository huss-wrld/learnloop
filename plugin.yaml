name: learnloop
version: "0.1.0"
description: "Structured lessons and practice inside Hermes: /learnloop:study probes what you know, plans a path and teaches with graded checks; /learnloop:practice drills it with hints. Builds a knowledge graph you can explore. Method adapted from LearnHarness."
author: Hussein Al-Amodi
license: AGPL-3.0-only
requires_hermes: ">=0.23.0"
provides_tools: [learn_ask, learn_grade, learn_phase, learn_method, learn_record, learn_recall, learn_problem, learn_conclude]
provides_hooks: [pre_llm_call, pre_tool_call, transform_llm_output, on_session_delete]
