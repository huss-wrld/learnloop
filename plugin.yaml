name: learnloop
version: "0.1.0"
description: "Structured lessons inside Hermes: /learnloop <topic> probes what you know, plans a path, and teaches with graded checks. What you learn joins a knowledge graph other chats can use (opt-in). Method adapted from LearnHarness."
author: Hussein Al-Amodi
license: AGPL-3.0-only
requires_hermes: ">=0.23.0"
provides_tools: [learn_ask, learn_grade, learn_phase, learn_method, learn_record, learn_recall, learn_problem, learn_conclude]
provides_hooks: [pre_llm_call, pre_tool_call, transform_llm_output, on_session_delete]
